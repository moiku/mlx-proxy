[project]
name = "mlx-proxy"
version = "1.1.0"
description = "MLX dynamic model proxy with OpenAI-compatible API, scoring, and MCP support"
requires-python = ">=3.12"
dependencies = [
    "mlx-lm>=0.31.3",
    "mlx-vlm>=0.6.3",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "mcp>=1.0",
]

